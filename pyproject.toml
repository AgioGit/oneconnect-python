[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oneconnect-python"
version = "0.1.2"
description = "Clavister NetWall OIDC + OpenConnect helper with reusable core and GTK UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "PyJWT>=2.8",
  "cryptography>=42",
]

[project.scripts]
oneconnect = "oneconnect_core.cli:main"
oneconnect-gui = "oneconnect_gui.app:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/oneconnect_core", "src/oneconnect_gui"]
